services:
  glpi:
    image: docker.io/glpi/glpi:11.0.6
    container_name: glpi
    networks:
      - default
      - waf_default
    volumes:
      - glpi:/var/glpi
    environment:
      GLPI_DB_HOST: glpi-db
      GLPI_DB_PORT: 3306
      GLPI_DB_NAME: ${GLPI_DB_NAME}
      GLPI_DB_USER: ${GLPI_DB_USER}
      GLPI_DB_PASSWORD: ${GLPI_DB_PASSWORD}
    healthcheck:
      test: ['CMD-SHELL', 'test -f /var/glpi/config/config_db.php && curl -sf http://localhost:80/ || exit 1']
      interval: 10s
      retries: 60
      start_period: 120s
    restart: unless-stopped
    depends_on:
      glpi-db:
        condition: service_healthy

  glpi-db:
    image: mariadb:12.2
    container_name: glpi-db
    volumes:
      - glpi-db:/var/lib/mysql
    environment:
      MARIADB_RANDOM_ROOT_PASSWORD: yes
      MARIADB_DATABASE: ${GLPI_DB_NAME}
      MARIADB_USER: ${GLPI_DB_USER}
      MARIADB_PASSWORD: ${GLPI_DB_PASSWORD}
    healthcheck:
      test: ['CMD', 'mariadb-admin', 'ping', '-h', '127.0.0.1', '-u', '${GLPI_DB_USER}', '--password=${GLPI_DB_PASSWORD}']
      interval: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  glpi-db:
    name: glpi-db
  glpi:
    name: glpi

networks:
  waf_default:
    external: true