services:
  zabbix-postgres:
    image: docker.io/library/postgres:17-alpine
    container_name: zabbix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${ZABBIX_DB_NAME}
      POSTGRES_USER: ${ZABBIX_DB_USER}
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD}
    volumes:
      - zabbix-postgres-data:/var/lib/postgresql/data:Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ZABBIX_DB_USER} -d ${ZABBIX_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  zabbix-server:
    image: docker.io/zabbix/zabbix-server-pgsql:alpine-7.4-latest
    container_name: zabbix-server
    restart: unless-stopped
    depends_on:
      zabbix-postgres:
        condition: service_healthy
    environment:
      DB_SERVER_HOST: zabbix-postgres
      DB_SERVER_PORT: "5432"
      POSTGRES_DB: ${ZABBIX_DB_NAME}
      POSTGRES_USER: ${ZABBIX_DB_USER}
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD}
      ZBX_SERVER_NAME: Zabbix Netzor
    ports:
      - "10051:10051"
    volumes:
      - zabbix-server-alertscripts:/usr/lib/zabbix/alertscripts:ro
      - zabbix-server-externalscripts:/usr/lib/zabbix/externalscripts:ro

  zabbix-web:
    image: docker.io/zabbix/zabbix-web-nginx-pgsql:alpine-7.4-latest
    container_name: zabbix-web
    restart: unless-stopped
    depends_on:
      zabbix-server:
        condition: service_started
      zabbix-postgres:
        condition: service_healthy
    environment:
      ZBX_SERVER_HOST: zabbix-server
      DB_SERVER_HOST: zabbix-postgres
      DB_SERVER_PORT: "5432"
      POSTGRES_DB: ${ZABBIX_DB_NAME}
      POSTGRES_USER: ${ZABBIX_DB_USER}
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD}
      PHP_TZ: Europe/Lisbon
      ZBX_SERVER_NAME: Zabbix Netzor
    networks:
      - default
      - waf_default

  zabbix-agent:
    image: docker.io/zabbix/zabbix-agent:alpine-7.4-latest
    container_name: zabbix-agent
    restart: unless-stopped
    depends_on:
      zabbix-server:
        condition: service_started
    environment:
      ZBX_HOSTNAME: "Zabbix server"
      ZBX_SERVER_HOST: zabbix-server
      ZBX_ACTIVE_ALLOW: "true"

networks:
  waf_default:
    external: true

volumes:
  zabbix-postgres-data:
    name: zabbix-postgres-data
  zabbix-server-alertscripts:
    name: zabbix-server-alertscripts
  zabbix-server-externalscripts:
    name: zabbix-server-externalscripts
