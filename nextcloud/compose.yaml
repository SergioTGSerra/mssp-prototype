services:
  nextcloud-postgres:
    image: docker.io/library/postgres:17-alpine
    container_name: nextcloud-postgres
    networks:
      - nextcloud-network
    environment:
      POSTGRES_DB: ${NEXTCLOUD_DB_NAME}
      POSTGRES_USER: ${NEXTCLOUD_DB_USER}
      POSTGRES_PASSWORD: ${NEXTCLOUD_DB_PASSWORD}
    volumes:
      - nextcloud-postgres-data:/var/lib/postgresql/data:Z
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NEXTCLOUD_DB_USER} -d ${NEXTCLOUD_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  nextcloud-redis:
    image: docker.io/library/redis:8.4-alpine
    container_name: nextcloud-redis
    networks:
      - nextcloud-network
    volumes:
      - nextcloud-redis-data:/data:Z
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]

  nextcloud:
    image: docker.io/library/nextcloud:31.0.12-apache
    container_name: nextcloud
    networks:
      - nextcloud-network
      - keycloak-network
      - mail-network
      - waf
    environment:
      POSTGRES_HOST: nextcloud-postgres
      POSTGRES_DB: ${NEXTCLOUD_DB_NAME}
      POSTGRES_USER: ${NEXTCLOUD_DB_USER}
      POSTGRES_PASSWORD: ${NEXTCLOUD_DB_PASSWORD}
      REDIS_HOST: nextcloud-redis
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
      NEXTCLOUD_TRUSTED_DOMAINS: "${NEXTCLOUD_HOSTNAME}"
      TRUSTED_PROXIES: "192.168.0.0/16 172.16.0.0/12 10.0.0.0/8"
      OVERWRITEHOST: ${NEXTCLOUD_HOSTNAME}
      OVERWRITEPROTOCOL: https
    volumes:
      - nextcloud-data:/var/www/html:Z
      - nextcloud-config-data:/var/www/html/config:Z
    restart: always
    depends_on:
      - nextcloud-postgres
      - nextcloud-redis
    extra_hosts:
      - "${ROUNDCUBE_HOSTNAME}:host-gateway"

networks:
  nextcloud-network:
    name: nextcloud-network
    driver: bridge
  keycloak-network:
    external: true
  mail-network:
    external: true
  waf:
    external: true

volumes:
  nextcloud-postgres-data:
    name: nextcloud-postgres-data
  nextcloud-redis-data:
    name: nextcloud-redis-data
  nextcloud-data:
    name: nextcloud-data
  nextcloud-config-data:
    name: nextcloud-config-data