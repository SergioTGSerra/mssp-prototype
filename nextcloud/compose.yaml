services:
  postgres-nextcloud:
    image: docker.io/library/postgres:17-alpine
    container_name: postgres-nextcloud
    networks:
      - nextcloud
    environment:
      POSTGRES_DB: ${NEXTCLOUD_DB_NAME}
      POSTGRES_USER: ${NEXTCLOUD_DB_USER}
      POSTGRES_PASSWORD: ${NEXTCLOUD_DB_PASSWORD}
    volumes:
      - nextcloud-db:/var/lib/postgresql/data:Z
    restart: always
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${NEXTCLOUD_DB_USER}", "-d", "${NEXTCLOUD_DB_NAME}"]

  redis-nextcloud:
    image: docker.io/library/redis:8.4-alpine
    container_name: redis-nextcloud
    networks:
      - nextcloud
    volumes:
      - nextcloud-redis-data:/data:Z
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]

  nextcloud-app:
    image: docker.io/library/nextcloud:production-fpm-alpine
    container_name: nextcloud-app
    networks:
      - nextcloud
    environment:
      POSTGRES_HOST: postgres-nextcloud
      POSTGRES_DB: ${NEXTCLOUD_DB_NAME}
      POSTGRES_USER: ${NEXTCLOUD_DB_USER}
      POSTGRES_PASSWORD: ${NEXTCLOUD_DB_PASSWORD}
      REDIS_HOST: redis-nextcloud
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
      NEXTCLOUD_TRUSTED_DOMAINS: "${NEXTCLOUD_HOSTNAME}"
      TRUSTED_PROXIES: "*"
      OVERWRITEHOST: ${NEXTCLOUD_HOSTNAME}
      OVERWRITEPROTOCOL: https
    volumes:
      - nextcloud-data:/var/www/html:Z
      - nextcloud-config:/var/www/html/config:Z
    restart: always
    depends_on:
      - postgres-nextcloud
      - redis-nextcloud

  nextcloud-web:
    image: docker.io/library/nginx:alpine
    container_name: nextcloud-web
    networks:
      - nextcloud
      - waf
    volumes:
      - nextcloud-data:/var/www/html:Z
      - ./nginx.conf:/etc/nginx/nginx.conf:ro,Z
    restart: always
    depends_on:
      - nextcloud-app

networks:
  nextcloud:
    name: nextcloud
    driver: bridge
  waf:
    external: true

volumes:
  nextcloud-db:
    name: nextcloud-db
  nextcloud-redis-data:
    name: nextcloud-redis-data
  nextcloud-data:
    name: nextcloud-data
  nextcloud-config:
    name: nextcloud-config